name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - lab-5
      - lab-6
      - lab-7
    tags:
      - "v*"
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: priority-notes-api
  APP_DIR: priority-notes-api

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: priority_notes
          POSTGRES_USER: notes_user
          POSTGRES_PASSWORD: notes_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notes_user -d priority_notes"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://notes_user:notes_password@localhost:5432/priority_notes

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ${{ env.APP_DIR }}/requirements.txt

      - run: pip install -r requirements.txt
      - run: pytest --cov=src --cov-report=xml --cov-report=term

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.APP_DIR }}/coverage.xml

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}

    steps:
      - uses: actions/checkout@v4

      - run: docker build -t ${{ env.IMAGE_NAME }}:latest .

      - run: |
          docker run -d -p 8000:8000 --name test-api ${{ env.IMAGE_NAME }}:latest
          sleep 10
          curl -f http://localhost:8000/health
          docker stop test-api

      - run: docker save ${{ env.IMAGE_NAME }}:latest -o image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ${{ env.APP_DIR }}/image.tar

  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: build

    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Set Docker tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "DOCKER_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "DOCKER_TAG=latest" >> $GITHUB_ENV
          fi

      - name: Login to DockerHub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }}