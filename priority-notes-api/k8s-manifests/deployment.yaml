apiVersion: apps/v1
kind: Deployment
metadata:
  name: priority-notes-deployment
  namespace: lab5
  labels:
    app: priority-notes
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: priority-notes
  template:
    metadata:
      labels:
        app: priority-notes
        version: v1
    spec:
      containers:
        - name: priority-notes-api
          image: priority-notes-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: priority-notes-config
            - secretRef:
                name: priority-notes-secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
