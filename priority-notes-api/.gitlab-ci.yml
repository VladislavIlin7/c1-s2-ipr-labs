stages:
  - test
  - build
  - publish

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  REDIS_URL: "redis://redis:6379/0"
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  DOCKER_TLS_CERTDIR: "/certs"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

test:
  stage: test
  image: python:3.11-slim
  services:
    - name: redis:7-alpine
      alias: redis
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - pytest --cov=src --cov-fail-under=70 --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=junit.xml
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - junit.xml
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  needs:
    - test
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build -t "$DOCKER_IMAGE" .
    - docker network create priority-notes-ci
    - docker run -d --name ci-redis --network priority-notes-ci redis:7-alpine
    - docker run -d --name ci-app --network priority-notes-ci -e REDIS_URL=redis://ci-redis:6379/0 -p 8000:8000 "$DOCKER_IMAGE"
    - sleep 10
    - docker exec ci-app python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
    - docker save "$DOCKER_IMAGE" -o image.tar
  after_script:
    - docker rm -f ci-app ci-redis || true
    - docker network rm priority-notes-ci || true
  artifacts:
    paths:
      - image.tar
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

publish:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  needs:
    - build
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker load -i image.tar
    - docker tag "$DOCKER_IMAGE" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$DOCKER_IMAGE"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
